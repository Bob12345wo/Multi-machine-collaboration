# car1 carries a forward arm extending about 0.30 m beyond the 0.22 m body.
# Keeping it inside the footprint prevents its laser return from becoming a
# self-obstacle while collision checking still protects the complete vehicle.
footprint: [[-0.23, -0.18], [-0.23, 0.18], [0.52, 0.18], [0.52, -0.18]]
footprint_padding: 0.02
obstacle_range: 2.0
raytrace_range: 3.0
inflation_radius: 0.28
cost_scaling_factor: 4.0
transform_tolerance: 0.4
obstacles_laser:
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 2.0
    raytrace_range: 3.0
